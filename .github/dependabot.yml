version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: cargo
    directory: '/contracts'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo_contracts:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns: ['*']

name: ci
on:
  push:
  pull_request:
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
        working-directory: contracts
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts
      - run: cargo test
        working-directory: contracts
      - run: rustup target add wasm32v1-none
      - name: Build WASM (cargo fallback; see README for the stellar-cli path)
        run: cargo build --release --target wasm32v1-none -p sideband-channel
        working-directory: contracts
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: '1'
      - run: test -s target/wasm32v1-none/release/sideband_channel.wasm
        working-directory: contracts

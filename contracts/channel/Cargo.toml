[package]
name = "sideband-channel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sideband one-way payment channel reference contract (Testnet/synthetic only, NOT audited)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
hex = "0.4"
